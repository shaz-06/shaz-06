    <circle cx="655"
            cy="316"
            r="24"
            fill="#0b1220"
            stroke="#a78bfa"/>

    <text x="655"
          y="322"
          text-anchor="middle"
          fill="#a78bfa"
          font-family="monospace"
          font-size="13"
