  <!-- Collaboration -->

  <g>

    <rect x="610"
          y="375"
          width="490"
          height="82"
          rx="18"
          fill="#101827"
          stroke="#f472b6"
          stroke-opacity=".55"/>

    <circle cx="655"
            cy="416"
            r="24"
            fill="#0b1220"
            stroke="#f472b6"/>

    <text x="655"
          y="422"
          text-anchor="middle"
          fill="#f472b6"
          font-family="monospace"
          font-size="13"
          font-weight="700">
      COLLAB
    </text>

    <text x="695"
          y="408"
          fill="#f8fafc"
          font-family="monospace"
          font-size="15"
          font-weight="700">
      BUILD TOGETHER
    </text>

    <text x="695"
          y="430"
          fill="#64748b"
          font-family="monospace"
          font-size="10">
      ideas • products • startups • experiments
    </text>

    <text x="1060"
          y="422"
          fill="#f472b6"
          font-family="monospace"
          font-size="22">
