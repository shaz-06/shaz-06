    </text>

    <text x="695"
          y="330"
          fill="#64748b"
          font-family="monospace"
          font-size="10">
      shashankshetty3219@gmail.com
    </text>

    <text x="1060"
          y="322"
          fill="#a78bfa"
          font-family="monospace"
          font-size="22">
