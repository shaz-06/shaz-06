<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="560"
     viewBox="0 0 1200 560">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>

    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64748b" opacity="0.16"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="leftClip">
      <rect x="30" y="30" width="555" height="500" rx="28"/>
    </clipPath>

    <clipPath id="rightClip">
      <rect x="615" y="30" width="555" height="500" rx="28"/>
    </clipPath>

  </defs>

  <!-- BACKGROUND -->

  <rect width="1200" height="560" rx="32" fill="url(#bg)"/>

  <rect width="1200" height="560" rx="32"
        fill="url(#dots)"/>

  <!-- LEFT CARD -->

  <rect x="30" y="30"
        width="555"
        height="500"
        rx="28"
        fill="#0f1724"
