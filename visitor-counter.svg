
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 300">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #101827; stroke: #08718a; stroke-width: 1.5; }
      .cyan { fill: #22d3ee; }
      .muted { fill: #94a3b8; }
      .digit {
        fill: #22d3ee;
        font: 700 42px monospace;
        text-anchor: middle;
      }
      .rolling {
        animation: roll 2s ease-out both;
      }
      @keyframes roll {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .pulse {
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse {
        50% { opacity: .35; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="298" rx="20"
        class="bg" stroke="#15566b" stroke-width="1.5"/>

  <rect x="22" y="33" width="46" height="46" rx="9" fill="#083344"/>
  <path d="M34 58 L42 48 L49 57 L57 43"
        fill="none" stroke="#22d3ee" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>

  <text x="80" y="40" class="cyan" font-size="20"
        font-family="Arial, sans-serif">SHAZ-06 / ANALYTICS</text>
  <text x="80" y="66" fill="#ffffff" font-size="23"
        font-weight="bold" font-family="Arial, sans-serif">GITHUB VISITOR COUNTER</text>

  <g class="pulse" fill="none" stroke="#34d399" stroke-width="2">
    <circle cx="955" cy="48" r="4"/>
    <path d="M946 39 Q934 48 946 57 M964 39 Q976 48 964 57"/>
  </g>

  <path d="M22 113 H978" stroke="#164e63" stroke-width="1"/>

  <text x="22" y="153" class="muted" font-size="16"
        font-family="Arial, sans-serif">TOTAL PROFILE VISITS</text>

  <g class="rolling">
    <rect x="22" y="174" width="310" height="65" rx="8" class="panel"/>
    <rect x="345" y="174" width="310" height="65" rx="8" class="panel"/>
    <rect x="668" y="174" width="310" height="65" rx="8" class="panel"/>

    <text x="177" y="218" class="digit">0</text>
    <text x="500" y="218" class="digit">9</text>
    <text x="823" y="218" class="digit">8</text>
  </g>

  <text x="22" y="273" class="muted" font-size="15"
        font-family="Arial, sans-serif">SHAZ-06 • Thanks for everyone visited my GitHub</text>
</svg>
