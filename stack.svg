<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="720"
     viewBox="0 0 1200 720">

  <defs>

    <!-- Midnight background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b14"/>
      <stop offset="0.5" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111126"/>
    </linearGradient>

    <!-- Aurora border -->
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Core glow -->
    <radialGradient id="core">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="0.35" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Chip glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot texture -->
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64748b" opacity="0.16"/>
    </pattern>

    <!-- Orbit paths -->
    <path id="orbit1"
          d="M600 270
             A310 125 0 1 1 599 270"
          fill="none"/>

    <path id="orbit2"
          d="M600 270
             A235 185 0 1 1 599 270"
          fill="none"/>

    <path id="orbit3"
          d="M600 270
             A150 230 0 1 1 599 270"
          fill="none"/>

  </defs>

  <!-- =====================================================
       BACKGROUND
       ===================================================== -->

  <rect width="1200" height="720" rx="34" fill="url(#bg)"/>

  <rect width="1200" height="720" rx="34"
        fill="url(#dots)"/>

  <rect x="3" y="3"
        width="1194"
        height="714"
        rx="31"
        fill="none"
        stroke="url(#aurora)"
        stroke-width="3"/>


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <text x="55"
        y="70"
        fill="#22d3ee"
        font-family="monospace"
        font-size="14"
        letter-spacing="4">
    SHAZ-06 // TECHNOLOGY MATRIX
  </text>

  <text x="55"
        y="112"
        fill="#f8fafc"
        font-family="monospace"
        font-size="34"
        font-weight="700">
    TECH STACK
  </text>

  <text x="55"
        y="142"
        fill="#64748b"
        font-family="monospace"
        font-size="14">
    tools orbiting ideas • building • shipping • evolving
  </text>


  <!-- =====================================================
       CORE
       ===================================================== -->

  <circle cx="600" cy="270" r="170" fill="url(#core)"/>

  <circle cx="600" cy="270" r="72"
          fill="#0d1422"
          stroke="#22d3ee"
          stroke-width="2"
          filter="url(#glow)">

    <animate attributeName="r"
             values="68;76;68"
             dur="3s"
             repeatCount="indefinite"/>

  </circle>

  <circle cx="600" cy="270" r="52"
          fill="#101827"
          stroke="#a78bfa"
          stroke-width="2"/>

  <text x="600"
        y="263"
        text-anchor="middle"
        fill="#22d3ee"
        font-family="monospace"
        font-size="18"
        font-weight="700">
    SHAZ
  </text>

  <text x="600"
        y="285"
        text-anchor="middle"
        fill="#94a3b8"
        font-family="monospace"
        font-size="11">
    FULL STACK
  </text>


  <!-- =====================================================
       ORBITS
       ===================================================== -->

  <ellipse cx="600" cy="270"
           rx="310"
           ry="125"
           fill="none"
           stroke="#22d3ee"
           stroke-opacity="0.28"
           stroke-width="1"/>

  <ellipse cx="600" cy="270"
           rx="235"
           ry="185"
           fill="none"
           stroke="#a78bfa"
           stroke-opacity="0.28"
           stroke-width="1"/>

  <ellipse cx="600" cy="270"
           rx="150"
           ry="230"
           fill="none"
           stroke="#f472b6"
           stroke-opacity="0.25"
           stroke-width="1"/>


  <!-- =====================================================
       ORBITING TECHNOLOGIES
       ===================================================== -->

  <g font-family="monospace"
     font-size="12"
     font-weight="700">

    <!-- Orbit 1 -->

    <g>
      <circle r="20" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
      <text x="0" y="4"
            text-anchor="middle"
            fill="#22d3ee">
        JS
      </text>

      <animateMotion dur="8s"
                     repeatCount="indefinite"
                     rotate="auto">
        <mpath href="#orbit1"/>
      </animateMotion>
    </g>

    <g>
      <circle r="20" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
      <text x="0" y="4"
            text-anchor="middle"
            fill="#22d3ee">
        C++
      </text>

      <animateMotion dur="8s"
                     begin="-2s"
                     repeatCount="indefinite">
        <mpath href="#orbit1"/>
      </animateMotion>
    </g>

    <g>
      <circle r="20" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
      <text x="0" y="4"
            text-anchor="middle"
            fill="#22d3ee">
        PY
      </text>

      <animateMotion dur="8s"
                     begin="-4s"
                     repeatCount="indefinite">
        <mpath href="#orbit1"/>
      </animateMotion>
    </g>

    <g>
      <circle r="20" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
      <text x="0" y="4"
            text-anchor="middle"
            fill="#22d3ee">
        GO
      </text>

      <animateMotion dur="8s"
                     begin="-6s"
                     repeatCount="indefinite">
        <mpath href="#orbit1"/>
      </animateMotion>
    </g>


    <!-- Orbit 2 -->

    <g>
      <circle r="22" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
      <text x="0" y="4"
            text-anchor="middle"
            fill="#a78bfa">
        REACT
      </text>

      <animateMotion dur="10s"
                     repeatCount="indefinite">
        <mpath href="#orbit2"/>
      </animateMotion>
    </g>

    <g>
      <circle r="22" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
      <text x="0" y="4"
            text-anchor="middle"
            fill="#a78bfa">
        NODE
      </text>

      <animateMotion dur="10s"
                     begin="-2.5s"
                     repeatCount="indefinite">
        <mpath href="#orbit2"/>
      </animateMotion>
    </g>

    <g>
      <circle r="22" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
      <text x="0" y="4"
            text-anchor="middle"
            fill="#a78bfa">
        DB
      </text>

      <animateMotion dur="10s"
                     begin="-5s"
                     repeatCount="indefinite">
        <mpath href="#orbit2"/>
      </animateMotion>
    </g>

    <g>
      <circle r="22" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
      <text x="0" y="4"
            text-anchor="middle"
            fill="#a78bfa">
        CLOUD
      </text>

      <animateMotion dur="10s"
                     begin="-7.5s"
                     repeatCount="indefinite">
        <mpath href="#orbit2"/>
      </animateMotion>
    </g>


    <!-- Orbit 3 -->

    <g>
      <circle r="21" fill="#111827" stroke="#f472b6" stroke-width="2"/>
      <text x="0" y="4"
            text-anchor="middle"
            fill="#f472b6">
        AWS
      </text>

      <animateMotion dur="12s"
                     repeatCount="indefinite">
        <mpath href="#orbit3"/>
      </animateMotion>
    </g>

    <g>
      <circle r="21" fill="#111827" stroke="#f472b6" stroke-width="2"/>
      <text x="0" y="4"
            text-anchor="middle"
            fill="#f472b6">
        GIT
      </text>

      <animateMotion dur="12s"
                     begin="-4s"
                     repeatCount="indefinite">
        <mpath href="#orbit3"/>
      </animateMotion>
    </g>

    <g>
      <circle r="21" fill="#111827" stroke="#f472b6" stroke-width="2"/>
      <text x="0" y="4"
            text-anchor="middle"
            fill="#f472b6">
        API
      </text>

      <animateMotion dur="12s"
                     begin="-8s"
                     repeatCount="indefinite">
        <mpath href="#orbit3"/>
      </animateMotion>
    </g>

  </g>


  <!-- =====================================================
       REACT MOONS
       ===================================================== -->

  <g>

    <circle cx="0" cy="0" r="7"
            fill="#22d3ee"
            stroke="#ffffff"
            stroke-width="1">

      <animateMotion dur="10s"
                     repeatCount="indefinite">
        <mpath href="#orbit2"/>
      </animateMotion>

      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0;360"
        dur="2s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="0" cy="0" r="5"
            fill="#f472b6">

      <animateMotion dur="10s"
                     begin="-0.7s"
                     repeatCount="indefinite">
        <mpath href="#orbit2"/>
      </animateMotion>
    </circle>

  </g>


  <!-- =====================================================
       CHIP GRID
       ===================================================== -->

  <text x="55"
        y="505"
        fill="#94a3b8"
        font-family="monospace"
        font-size="13"
        letter-spacing="2">
    CAPABILITY GROUPS
  </text>


  <!-- Frontend -->

  <rect x="55" y="530"
        width="250"
        height="135"
        rx="20"
        fill="#101621"
        stroke="#22d3ee"
        stroke-opacity="0.55"/>

  <text x="78" y="558"
        fill="#22d3ee"
        font-family="monospace"
        font-size="15"
        font-weight="700">
    FRONTEND
  </text>

  <g font-family="monospace" font-size="11">

    <rect x="78" y="575" width="75" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="115" y="593" text-anchor="middle" fill="#cbd5e1">HTML5</text>

    <rect x="160" y="575" width="65" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="192" y="593" text-anchor="middle" fill="#cbd5e1">CSS3</text>

    <rect x="232" y="575" width="55" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="259" y="593" text-anchor="middle" fill="#cbd5e1">React</text>

    <rect x="78" y="612" width="75" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="115" y="630" text-anchor="middle" fill="#cbd5e1">Flutter</text>

    <rect x="160" y="612" width="65" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="192" y="630" text-anchor="middle" fill="#cbd5e1">Dart</text>

  </g>


  <!-- Backend -->

  <rect x="325" y="530"
        width="250"
        height="135"
        rx="20"
        fill="#101621"
        stroke="#a78bfa"
        stroke-opacity="0.55"/>

  <text x="348" y="558"
        fill="#a78bfa"
        font-family="monospace"
        font-size="15"
        font-weight="700">
    BACKEND
  </text>

  <g font-family="monospace" font-size="11">

    <rect x="348" y="575" width="78" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="387" y="593" text-anchor="middle" fill="#cbd5e1">Node.js</text>

    <rect x="433" y="575" width="78" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="472" y="593" text-anchor="middle" fill="#cbd5e1">Express</text>

    <rect x="518" y="575" width="40" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="538" y="593" text-anchor="middle" fill="#cbd5e1">API</text>

    <rect x="348" y="612" width="78" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="387" y="630" text-anchor="middle" fill="#cbd5e1">FastAPI</text>

    <rect x="433" y="612" width="78" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="472" y="630" text-anchor="middle" fill="#cbd5e1">Django</text>

  </g>


  <!-- Data -->

  <rect x="595" y="530"
        width="250"
        height="135"
        rx="20"
        fill="#101621"
        stroke="#f472b6"
        stroke-opacity="0.55"/>

  <text x="618" y="558"
        fill="#f472b6"
        font-family="monospace"
        font-size="15"
        font-weight="700">
    DATA
  </text>

  <g font-family="monospace" font-size="11">

    <rect x="618" y="575" width="82" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="659" y="593" text-anchor="middle" fill="#cbd5e1">MongoDB</text>

    <rect x="708" y="575" width="70" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="743" y="593" text-anchor="middle" fill="#cbd5e1">MySQL</text>

    <rect x="786" y="575" width="50" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="811" y="593" text-anchor="middle" fill="#cbd5e1">SQL</text>

    <rect x="618" y="612" width="82" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="659" y="630" text-anchor="middle" fill="#cbd5e1">Postgres</text>

    <rect x="708" y="612" width="70" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="743" y="630" text-anchor="middle" fill="#cbd5e1">SQLite</text>

  </g>


  <!-- AI / Cloud -->

  <rect x="865" y="530"
        width="280"
        height="135"
        rx="20"
        fill="#101621"
        stroke="url(#aurora)"
        stroke-opacity="0.7"/>

  <text x="888" y="558"
        fill="#f8fafc"
        font-family="monospace"
        font-size="15"
        font-weight="700">
    AI / CLOUD
  </text>

  <g font-family="monospace" font-size="11">

    <rect x="888" y="575" width="65" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="920" y="593" text-anchor="middle" fill="#cbd5e1">AWS</text>

    <rect x="960" y="575" width="70" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="995" y="593" text-anchor="middle" fill="#cbd5e1">Azure</text>

    <rect x="1037" y="575" width="82" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="1078" y="593" text-anchor="middle" fill="#cbd5e1">Firebase</text>

    <rect x="888" y="612" width="75" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="925" y="630" text-anchor="middle" fill="#cbd5e1">Supabase</text>

    <rect x="970" y="612" width="65" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="1002" y="630" text-anchor="middle" fill="#cbd5e1">Docker</text>

    <rect x="1042" y="612" width="77" height="28" rx="14"
          fill="#0d1117" stroke="#334155"/>
    <text x="1080" y="630" text-anchor="middle" fill="#cbd5e1">GitHub</text>

  </g>


  <!-- =====================================================
       CHIP SEQUENTIAL GLOW
       ===================================================== -->

  <rect x="78" y="575"
        width="75"
        height="28"
        rx="14"
        fill="none"
        stroke="#22d3ee"
        opacity="0">
    <animate attributeName="opacity"
             values="0;1;0"
             dur="4s"
             repeatCount="indefinite"/>
  </rect>

  <rect x="348" y="575"
        width="78"
        height="28"
        rx="14"
        fill="none"
        stroke="#a78bfa"
        opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;0"
             dur="4s"
             repeatCount="indefinite"/>
  </rect>

  <rect x="618" y="575"
        width="82"
        height="28"
        rx="14"
        fill="none"
        stroke="#f472b6"
        opacity="0">
    <animate attributeName="opacity"
             values="0;0;0;1;0"
             dur="4s"
             repeatCount="indefinite"/>
  </rect>

  <rect x="888" y="575"
        width="65"
        height="28"
        rx="14"
        fill="none"
        stroke="#22d3ee"
        opacity="0">
    <animate attributeName="opacity"
             values="0;0;0;0;1;0"
             dur="4s"
             repeatCount="indefinite"/>
  </rect>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <circle cx="1080" cy="72" r="6"
          fill="#22d3ee">

    <animate attributeName="opacity"
             values="1;.25;1"
             dur="1.4s"
             repeatCount="indefinite"/>

  </circle>

  <text x="1098"
        y="77"
        fill="#64748b"
        font-family="monospace"
        font-size="11">
    SYSTEM ONLINE
  </text>

</svg>
